# dx Terminal: the tmux server behind the browser's Terminal tab, shared by
# the person and the agent. dxd attaches its PTY with
#   /opt/dx/bin/tmux -L dx -f /opt/dx/share/tmux.conf new-session -A -s main
# Everything not set here is a tmux default, including the C-b prefix.

# Panes see a tmux terminal with true color; the outer terminal is dxd's PTY
# (TERM=xterm-256color) rendered by ghostty-web, which supports RGB, the
# xterm modifyOtherKeys extended keys, OSC 52, and focus reporting.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:extkeys:clipboard:focus"
set -g extended-keys on
set -g focus-events on
set -g set-clipboard on
set-environment -g COLORTERM truecolor

# Keys reach the shell at once; Escape is not held back to detect Alt.
set -g escape-time 0
set -g history-limit 10000

# The session outlives every client: dxd restarts, updates, and browser
# disconnects detach its client, never end the shells. The server ends with
# its last session.
set -g exit-unattached off
set -g destroy-unattached off

# The browser keeps no scrollback of its own behind tmux, so the wheel scrolls
# tmux history (copy mode); Shift+drag still selects in the browser.
set -g mouse on

# The status line shows the windows the agent and the person open. It uses
# the terminal's own colors, so the dx terminal theme applies, and has no
# clock: periodic redraws would send output while nothing happens.
set -g status-style default
set -g status-interval 0
set -g status-right ""
set -g window-status-current-style reverse
