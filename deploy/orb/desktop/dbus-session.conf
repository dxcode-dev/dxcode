<!-- The Desktop's own session bus (./start runs dbus-run-session with it).
     Unlike a distribution's session.conf it lists no service directories, so
     the bus starts none of the host's programs (desktop portals, the
     accessibility bus): a program on the desktop that asks for one gets an
     error and carries on, the same on every host. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
