name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Pinned: Playwright 1.55 cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Web's React tests run in this Chromium.
      - run: pnpm --filter @dx/web exec playwright install --with-deps chromium-headless-shell
      - run: pnpm test:unit
      - run: pnpm test:dxd
      - run: pnpm build
