packages:
  - apps/*
  - internal
  - packages/*
  - tooling/*

overrides:
  "@opentelemetry/api": 1.9.0
  "@better-auth/utils": 0.4.2
  "@earendil-works/pi-ai": 1.1.0
  "@earendil-works/pi-agent-core": 1.1.0
  "@earendil-works/pi-telemetry": 1.1.0
  "@flue/runtime": file:third-party/flue/runtime-df4cbd8b7d96266906d9549ecac4e4d4290dbb00.tgz

patchedDependencies:
  alchemy@2.0.0-beta.83: third-party/alchemy/alchemy@2.0.0-beta.83.patch
  ghostty-web@0.4.0: third-party/ghostty-web/ghostty-web@0.4.0.patch

# Dependency install scripts. pnpm fails the install when a package with a
# script is missing here. esbuild and workerd link their platform binaries; the
# rest are optional downloads, messages, or no-ops dx does not need.
# Refuse an install on a Node.js older than the root package's engines.node,
# instead of failing later in a build or deploy.
engineStrict: true

# Supply-chain cooldown: pnpm installs no dependency version published less
# than 7 days ago (10080 minutes). Most malicious releases are found and
# pulled within that window. Strict mode makes a too-new version fail the
# install instead of being silently added to minimumReleaseAgeExclude; pnpm 12
# needs it set explicitly (pnpm/pnpm#14409).
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true

allowBuilds:
  esbuild: true
  workerd: true
  "@google/genai": false
  "@vgpu/adapter-node": false
  core-js-pure: false
  msw: false
  protobufjs: false
  webgpu: false
